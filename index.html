<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Things // Registry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* The Playful Palette */
            --cyan: #06b6d4;
            --pink: #d946ef;
            --orange: #f97316;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000; 
            color: #fff;
            margin: 0;
            overflow-x: hidden;
        }

        h1, h2 { font-family: 'Sora', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Holographic Hero Text */
        .hero-text {
            font-size: clamp(4rem, 16vw, 10rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            margin: 0;
            background: linear-gradient(45deg, #fff, #f0f0f0, var(--cyan), var(--pink), #fff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: 
                hero-shift 10s ease infinite,
                fade-in-up 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards,
                float-slow 6s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes hero-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(30px) skewY(2deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) skewY(0deg);
            }
        }

        @keyframes float-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* --- CARD STYLE --- */
        .fancy-card-wrapper {
            position: relative;
            border-radius: 24px;
            max-width: 100%; 
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .fancy-card-wrapper:hover {
            transform: scale(1.005) translateY(-4px);
        }

        /* The Animated Gradient Border */
        .fancy-card-wrapper::before {
            content: "";
            position: absolute;
            inset: -1.5px;
            border-radius: 25px;
            background: linear-gradient(
                45deg, 
                var(--cyan), 
                var(--pink), 
                var(--orange), 
                var(--cyan)
            );
            background-size: 400% 400%;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
            animation: gradient-shift 3s ease infinite;
        }

        .fancy-card-wrapper:hover::before {
            opacity: 1;
        }

        /* Soft Outer Glow on Hover */
        .fancy-card-wrapper::after {
            content: "";
            position: absolute;
            inset: -15px;
            border-radius: 40px;
            background: linear-gradient(45deg, var(--cyan), var(--pink), var(--orange));
            z-index: -2;
            opacity: 0;
            filter: blur(30px);
            transition: opacity 0.6s ease;
        }

        .fancy-card-wrapper:hover::after {
            opacity: 0.25;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .fancy-card-content {
            position: relative;
            background: #0a0a0a;
            border-radius: 24px;
            height: 100%;
            width: 100%;
            z-index: 1;
            border: 1px solid rgba(255,255,255,0.1);
            transition: border-color 0.5s ease;
        }

        .fancy-card-wrapper:hover .fancy-card-content {
            border-color: rgba(255,255,255,0.2);
        }
        /* ------------------ */

        /* Background Grain & Grid */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* SVG Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-float-delayed { animation: float 6s ease-in-out infinite; animation-delay: 3s; }

        @keyframes bar-anim {
            0%, 100% { height: 20px; transform: translateY(0); }
            50% { height: 40px; transform: translateY(-20px); }
        }
        .bar-anim { animation: bar-anim 2s ease-in-out infinite; }

        /* Super Amazing GitHub Hover Effect */
        .github-link {
            position: relative;
            padding: 8px 16px;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .github-link::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.1), rgba(217, 70, 239, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: -1;
        }

        .github-link:hover::before {
            transform: translateX(100%);
        }

        .github-link:hover {
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.1);
        }

        .github-link:hover svg {
            animation: github-float 2s ease-in-out infinite, github-vibrate 0.3s linear infinite;
            filter: drop-shadow(0 0 12px var(--cyan)) drop-shadow(0 0 20px var(--pink));
        }

        @keyframes github-float {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1.2); }
            50% { transform: translateY(-5px) rotate(8deg) scale(1.25); }
        }

        @keyframes github-vibrate {
            0% { transform: translate(0) rotate(8deg) scale(1.25); }
            25% { transform: translate(1px, -1px) rotate(9deg); }
            50% { transform: translate(-1px, 1px) rotate(7deg); }
            75% { transform: translate(1px, 1px) rotate(8deg); }
            100% { transform: translate(0) rotate(8deg); }
        }

        .github-text-anim {
            display: inline-block;
            transition: all 0.3s ease;
        }

        .github-link:hover .github-text-anim {
            animation: text-glitch-sm 0.3s step-end infinite;
            letter-spacing: 0.2em;
        }

        @keyframes text-glitch-sm {
            0% { transform: skew(0deg); filter: blur(0); }
            20% { transform: skew(2deg); filter: blur(1px); }
            40% { transform: skew(-2deg); }
            60% { transform: skew(1deg); }
            100% { transform: skew(0deg); }
        }
    </style>
</head>
